name: wird_quran
description: "اِقْرَأْ وَارْتَقِ – القرآن الكريم للحفظ والمراجعة: تلاوة الشيخ الزين محمد أحمد مع تكرار دقيق للآيات بالاعتماد على توقيتات كل آية."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  http: ^1.2.2
  provider: ^6.1.5
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/quran.json
    - assets/data/timings.json
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf
